name: CI/CD

# Run tests on every push and PR to main. Deploy only when a push lands on
# main (i.e. a merge). If the test job fails, the deploy job is skipped
# automatically because it `needs` the test job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: src
        run: python -m pytest

  deploy:
    name: Deploy to server
    needs: test # skipped if tests fail
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Optional: gate on a GitHub "environment" for a manual approval / protected secrets.
    # environment: production
    env:
      # Secrets (Settings -> Secrets and variables -> Actions -> Secrets)
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      # Variables (same page -> Variables tab) — non-sensitive config
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }} # e.g. /home/deploy/trend-engine
      API_SERVICE: ${{ vars.API_SERVICE }} # e.g. trend-engine-api
      WEB_ROOT: ${{ vars.WEB_ROOT }} # e.g. /var/www/ui (must be writable by SSH_USER)
      VENV_PATH: ${{ vars.VENV_PATH }} # optional; defaults to $DEPLOY_PATH/.venv
    steps:
      - uses: actions/checkout@v4

      # The UI is built here on the runner (node is guaranteed available), not on
      # the server — so the server needs no node/nvm, and we ship the built dist/.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Ship the built UI. --delete removes stale hashed bundles from a prior build.
      # WEB_ROOT is owned by SSH_USER, which is a member of group `web` (nginx's
      # www-data is also in `web`). --chown=:web forces every transferred file and
      # subdir to group `web` on each deploy — not relying on the setgid bit, which
      # rsync's --chmod can strip off subdirs like assets/ and cause 403s.
      # --chmod then sets owner rw / group r / no world access.
      - name: Upload built UI
        run: |
          set -euo pipefail
          rsync -rlptz --delete \
            --chown=:web \
            --chmod=Du=rwx,Dg=rx,Do=,Fu=rw,Fg=r,Fo= \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            ui/dist/ "$SSH_USER@$SSH_HOST:$WEB_ROOT/"

      # Pull source, install Python deps, run migrations, restart the API — on the
      # server, where the DB and .env live. Config is passed through as env vars.
      - name: Deploy backend
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' API_SERVICE='$API_SERVICE' VENV_PATH='$VENV_PATH' bash -s" \
            < scripts/deploy.sh
